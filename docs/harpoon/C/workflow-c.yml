name: Harpoon C inertial guidance seeker and no-DL CIC
on:
  pull_request:
    paths:
      - 'Aegis_SIM_v48_WIP_HARPOON_C.html'
      - 'AEGIS_PLAN_STATUS_v48_WIP_HARPOON_C.md'
      - 'SHA256SUMS_v48_WIP_HARPOON_C.txt'
      - 'docs/harpoon/**'
      - '.github/workflows/harpoon-c.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_HARPOON_C.html
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy==2.3.5
      - name: Verify C and reconstruct unuploaded comparison artifacts from K
        run: |
          sha256sum -c SHA256SUMS_v48_WIP_HARPOON_C.txt
          sha256sum -c docs/harpoon/C/REPOSITORY_SUPPORT.sha256
          python docs/harpoon/A/build.py --out artifacts/harpoon/baseline-A.html
          python docs/harpoon/B/build.py --baseline artifacts/harpoon/baseline-A.html --out artifacts/harpoon/baseline-B.html
          python docs/harpoon/C/verify_static.py "$AEGIS_CANDIDATE" artifacts/harpoon/static --baseline artifacts/harpoon/baseline-B.html
          python docs/harpoon/C/verify_guidance.py "$AEGIS_CANDIDATE" artifacts/harpoon/guidance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harpoon-c-static-${{ github.sha }}
          path: artifacts/harpoon
          if-no-files-found: error
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, native, salvo, stage, knowledge, salvo_identity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/bunkerhill/K/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - name: Exercise C with real radar tracks and native WebGL or fixed ticks
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.suite }}' in
            native|knowledge|salvo_identity)
              python docs/harpoon/C/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/harpoon/${{ matrix.suite }}
              ;;
            stage)
              python docs/harpoon/B/verify_stage.py "$AEGIS_CANDIDATE" artifacts/harpoon/stage
              ;;
            runtime|salvo)
              python docs/harpoon/A/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/harpoon/${{ matrix.suite }}
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harpoon-c-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/harpoon/${{ matrix.suite }}
          if-no-files-found: error
