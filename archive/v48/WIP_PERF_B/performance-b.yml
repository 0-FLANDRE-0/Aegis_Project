name: Performance B engagement planner and SPG (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_PERF_B.html
  AEGIS_BASELINE: archive/v48/WIP_PERF_A/Aegis_SIM_v48_WIP_PERF_A.html
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix docs/performance/B --ignore-scripts --no-audit --no-fund
          sha256sum -c SHA256SUMS_v48_WIP_PERF_B.txt
          sha256sum -c docs/performance/B/REPOSITORY_SUPPORT.sha256
          python docs/performance/B/verify_static.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/PERF_B/static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-b-static-${{ github.sha }}
          path: artifacts/PERF_B
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [team, intent-h4, ui-h4, natural-h4, attack, attack-guards, ui-h3, surface, clock, maneuver, guards, ui-h2, natural-h2, baseline, tactical, policy, ui-h1, cooperation, harpoon, camera, defense, natural-ew, native, harpoon-defense, closein, clock-defense, semantics, resources, planner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/bunkerhill/K/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - name: Run final original HTML
        run: python docs/performance/B/run_suite.py '${{ matrix.suite }}' "$AEGIS_CANDIDATE" artifacts/PERF_B/'${{ matrix.suite }}' --baseline "$AEGIS_BASELINE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-b-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/PERF_B
          if-no-files-found: error
