name: Helicopter B rotor, deck paths and navigation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_HELI_B.html
  AEGIS_BASELINE: archive/v48/WIP_HELI_A/Aegis_SIM_v48_WIP_HELI_A.html
  NODE_PATH: ${{ github.workspace }}/docs/performance/F/node_modules
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix docs/performance/F --ignore-scripts --no-audit --no-fund
          sha256sum -c SHA256SUMS_v48_WIP_HELI_B.txt
          sha256sum -c docs/helicopter/C/REPOSITORY_SUPPORT.sha256
          python docs/helicopter/C/run_suite.py static "$AEGIS_CANDIDATE" artifacts/HELI_B/static --baseline "$AEGIS_BASELINE"
          python docs/helicopter/C/run_suite.py motion "$AEGIS_CANDIDATE" artifacts/HELI_B/motion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helicopter-b-static-${{ github.sha }}
          path: artifacts/HELI_B
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, ui, native, clock, baseline, extensions, legacy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r docs/helicopter/C/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - run: python docs/helicopter/C/run_suite.py '${{ matrix.suite }}' "$AEGIS_CANDIDATE" artifacts/HELI_B/'${{ matrix.suite }}' --baseline "$AEGIS_BASELINE"
      - name: Independent geometry clearance and source axes
        if: matrix.suite == 'extensions'
        run: |
          python docs/helicopter/C/verify_clearance.py artifacts/HELI_B/extensions/extensions.json artifacts/HELI_B/clearance
          python docs/helicopter/C/measure_rotors.py artifacts/HELI_B/rig-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helicopter-b-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/HELI_B
          if-no-files-found: error
