name: Multi Ship G fleet controls, friendly network and launch protection (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_MULTI_SHIP_G.html
  AEGIS_BASELINE: archive/v48/WIP_MULTI_SHIP_F/Aegis_SIM_v48_WIP_MULTI_SHIP_F.html
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix docs/multiship/G --ignore-scripts --no-audit --no-fund
          sha256sum -c SHA256SUMS_v48_WIP_MULTI_SHIP_G.txt
          sha256sum -c docs/multiship/G/REPOSITORY_SUPPORT.sha256
          python docs/multiship/G/verify_static.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/G/static
          python docs/multiship/G/verify_guidance.py "$AEGIS_CANDIDATE" artifacts/G/guidance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiship-g-static-${{ github.sha }}
          path: artifacts/G
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [fleet-ui, fleet-camera, network, cooperation, harpoon, clock, ew, natural, native, aircraft, defense, weapons, baseline, routes, knowledge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/bunkerhill/K/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - name: Run final artifact fixtures
        run: |
          if [ "${{ matrix.suite }}" = fleet-ui ] || [ "${{ matrix.suite }}" = fleet-camera ]; then
            python docs/multiship/G/verify_fleet.py "$AEGIS_CANDIDATE" artifacts/G/${{ matrix.suite }} --suite "${{ matrix.suite == 'fleet-camera' && 'camera' || 'ui' }}"
          elif [ "${{ matrix.suite }}" = network ] || [ "${{ matrix.suite }}" = cooperation ] || [ "${{ matrix.suite }}" = clock ]; then
            python docs/multiship/G/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/G/${{ matrix.suite }}
          elif [ "${{ matrix.suite }}" = harpoon ] || [ "${{ matrix.suite }}" = baseline ]; then
            python docs/multiship/G/verify_${{ matrix.suite }}.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/G/${{ matrix.suite }}
          elif [ "${{ matrix.suite }}" = ew ]; then
            python docs/multiship/F/verify.py "$AEGIS_CANDIDATE" artifacts/G/ew
          elif [ "${{ matrix.suite }}" = aircraft ]; then
            python docs/multiship/F/verify_departure.py "$AEGIS_CANDIDATE" artifacts/G/aircraft
          elif [ "${{ matrix.suite }}" = defense ]; then
            python docs/multiship/E/verify_defense.py "$AEGIS_CANDIDATE" artifacts/G/defense
          elif [ "${{ matrix.suite }}" = weapons ]; then
            python docs/multiship/F/verify_regression.py weapons "$AEGIS_CANDIDATE" artifacts/G/weapons
          elif [ "${{ matrix.suite }}" = routes ] || [ "${{ matrix.suite }}" = knowledge ]; then
            python docs/harpoon/E/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/G/${{ matrix.suite }}
          else
            python docs/multiship/F/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/G/${{ matrix.suite }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiship-g-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/G
          if-no-files-found: error
