name: PIP B and ENV A (manual)
on:
  workflow_dispatch:
    inputs:
      full_envelope:
        description: 'Run both expensive offline envelope sweeps'
        type: boolean
        default: false
permissions:
  contents: read
env:
  NODE_PATH: ${{ github.workspace }}/docs/performance/F/node_modules
  MPLCONFIGDIR: /tmp/aegis-env-matplotlib
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix docs/performance/F --ignore-scripts --no-audit --no-fund
          pip install -r docs/helicopter/F/requirements.txt matplotlib
          python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_PIP_B.txt
          sha256sum -c docs/pip/B/REPOSITORY_SUPPORT.sha256
          python docs/pip/B/build.py archive/v48/WIP_PIP_A/Aegis_SIM_v48_WIP_PIP_A.html /tmp/PIP_B.html
          cmp /tmp/PIP_B.html Aegis_SIM_v48_WIP_PIP_B.html
          python docs/pip/B/verify_static.py archive/v48/WIP_PIP_A/Aegis_SIM_v48_WIP_PIP_A.html Aegis_SIM_v48_WIP_PIP_B.html artifacts/static
          python docs/pip/B/verify_ui.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/ui
          python docs/pip/B/verify_pip.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/input
          python docs/pip/B/verify_pip.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/invariance --part invariance
          python docs/pip/B/verify_render.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/render
          python docs/pip/B/verify_circle.py archive/v48/WIP_PIP_A/Aegis_SIM_v48_WIP_PIP_A.html Aegis_SIM_v48_WIP_PIP_B.html artifacts/circle
          python docs/pip/B/run_domain.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/domain --parallel 2
          python docs/envelope/A/verify_browser.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/envelope-native
          python docs/envelope/A/verify_status.py Aegis_SIM_v48_WIP_PIP_B.html artifacts/envelope-status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-b-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
  envelope:
    if: inputs.full_envelope
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib
      - run: |
          mkdir -p artifacts/envelope
          node docs/envelope/A/run.cjs artifacts/envelope/run-1.json
          node docs/envelope/A/run.cjs artifacts/envelope/run-2.json
          python docs/envelope/A/verify_results.py artifacts/envelope/run-1.json artifacts/envelope/run-2.json artifacts/envelope
          python docs/envelope/A/report.py artifacts/envelope/run-1.json artifacts/envelope/graphs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: envelope-a-${{ github.sha }}
          path: artifacts/envelope
          if-no-files-found: error
