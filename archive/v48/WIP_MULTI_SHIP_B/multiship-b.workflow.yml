name: Multi Ship B physical fleet and owner rendering
on:
  pull_request:
    paths:
      - 'Aegis_SIM_v48_WIP_MULTI_SHIP_B.html'
      - 'AEGIS_PLAN_STATUS_v48_WIP_MULTI_SHIP_B.md'
      - 'SHA256SUMS_v48_WIP_MULTI_SHIP_B.txt'
      - 'docs/multiship/B/**'
      - '.github/workflows/multiship-b.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_MULTI_SHIP_B.html
  AEGIS_BASELINE: archive/v48/WIP_MULTI_SHIP_A/Aegis_SIM_v48_WIP_MULTI_SHIP_A.html
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_MULTI_SHIP_B.txt
          sha256sum -c docs/multiship/B/REPOSITORY_SUPPORT.sha256
          python docs/multiship/B/verify_static.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/multiship/static
          python docs/harpoon/E/verify_guidance.py "$AEGIS_CANDIDATE" artifacts/multiship/guidance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiship-b-static-${{ github.sha }}
          path: artifacts/multiship
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [departure, runtime, contacts, baseline, native, clock, routes, knowledge, harpoon-clock, ddg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/bunkerhill/K/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - name: Run final artifact fixtures
        run: |
          if [ "${{ matrix.suite }}" = baseline ]; then
            python docs/multiship/A/verify_baseline.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/multiship/baseline
          elif [ "${{ matrix.suite }}" = native ]; then
            python docs/multiship/B/verify_native.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/multiship/native
          elif [ "${{ matrix.suite }}" = ddg ]; then
            mkdir -p artifacts/multiship/ddg
            python docs/ship-startup/A/tests/runtime.py "$AEGIS_CANDIDATE" > artifacts/multiship/ddg/runtime.json
          elif [ "${{ matrix.suite }}" = routes ] || [ "${{ matrix.suite }}" = knowledge ]; then
            python docs/harpoon/E/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/multiship/${{ matrix.suite }}
          elif [ "${{ matrix.suite }}" = harpoon-clock ]; then
            python docs/harpoon/E/verify_clock.py "$AEGIS_CANDIDATE" artifacts/multiship/harpoon-clock
          else
            python docs/multiship/B/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/multiship/${{ matrix.suite }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiship-b-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/multiship
          if-no-files-found: error
