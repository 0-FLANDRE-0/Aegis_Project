name: Multi Ship E defensive AI and aircraft scenario
on:
  pull_request:
    paths:
      - 'Aegis_SIM_v48_WIP_MULTI_SHIP_E.html'
      - 'AEGIS_PLAN_STATUS_v48_WIP_MULTI_SHIP_E.md'
      - 'SHA256SUMS_v48_WIP_MULTI_SHIP_E.txt'
      - 'docs/multiship/E/**'
      - '.github/workflows/multiship-e.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_MULTI_SHIP_E.html
  AEGIS_BASELINE: archive/v48/WIP_MULTI_SHIP_D/Aegis_SIM_v48_WIP_MULTI_SHIP_D.html
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_MULTI_SHIP_E.txt
          sha256sum -c docs/multiship/E/REPOSITORY_SUPPORT.sha256
          python docs/multiship/E/verify_static.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/multiship/static
          python docs/multiship/D/verify_guidance.py "$AEGIS_CANDIDATE" artifacts/multiship/guidance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiship-e-static-${{ github.sha }}
          path: artifacts/multiship
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [defense, aircraft, natural, closein, clock, native, weapon-native, weapons, effectors, battle, observers, propagation, observer-native, baseline, departure, routes, knowledge, ddg]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/bunkerhill/K/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - name: Run final artifact fixtures
        run: |
          if [ "${{ matrix.suite }}" = baseline ]; then
            python docs/multiship/A/verify_baseline.py "$AEGIS_BASELINE" "$AEGIS_CANDIDATE" artifacts/multiship/baseline
          elif [ "${{ matrix.suite }}" = observer-native ]; then
            python docs/multiship/C/verify_native.py "$AEGIS_CANDIDATE" artifacts/multiship/observer-native
          elif [ "${{ matrix.suite }}" = departure ]; then
            python docs/multiship/B/verify_departure.py "$AEGIS_CANDIDATE" artifacts/multiship/departure
          elif [ "${{ matrix.suite }}" = ddg ]; then
            mkdir -p artifacts/multiship/ddg
            python docs/ship-startup/A/tests/runtime.py "$AEGIS_CANDIDATE" > artifacts/multiship/ddg/runtime.json
          elif [ "${{ matrix.suite }}" = routes ] || [ "${{ matrix.suite }}" = knowledge ]; then
            python docs/harpoon/E/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/multiship/${{ matrix.suite }}
          elif [ "${{ matrix.suite }}" = observers ]; then
            python docs/multiship/E/verify_observers.py "$AEGIS_CANDIDATE" artifacts/multiship/observers
          elif [ "${{ matrix.suite }}" = propagation ]; then
            python docs/multiship/C/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/multiship/${{ matrix.suite }}
          elif [ "${{ matrix.suite }}" = aircraft ]; then
            python docs/multiship/E/verify_departure.py "$AEGIS_CANDIDATE" artifacts/multiship/aircraft
          elif [ "${{ matrix.suite }}" = weapon-native ]; then
            python docs/multiship/E/verify_regression.py native "$AEGIS_CANDIDATE" artifacts/multiship/weapon-native
          elif [ "${{ matrix.suite }}" = weapons ] || [ "${{ matrix.suite }}" = effectors ] || [ "${{ matrix.suite }}" = battle ]; then
            python docs/multiship/E/verify_regression.py ${{ matrix.suite }} "$AEGIS_CANDIDATE" artifacts/multiship/${{ matrix.suite }}
          else
            python docs/multiship/E/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/multiship/${{ matrix.suite }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiship-e-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/multiship
          if-no-files-found: error
