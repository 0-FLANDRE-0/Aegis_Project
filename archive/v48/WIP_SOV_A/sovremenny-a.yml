name: Sovremenny A NPC hull (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_PATH: ${{ github.workspace }}/docs/performance/F/node_modules
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix docs/performance/F --ignore-scripts --no-audit --no-fund
          pip install -r docs/helicopter/F/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_SOV_A.txt
          sha256sum -c docs/sovremenny/A/REPOSITORY_SUPPORT.sha256
          node docs/sovremenny/A/library.cjs
          git diff --exit-code -- docs/sovremenny/A/library.json
          python docs/sovremenny/A/build.py archive/v48/WIP_HELI_F2/Aegis_SIM_v48_WIP_HELI_F2.html /tmp/SOV_A.html
          cmp /tmp/SOV_A.html Aegis_SIM_v48_WIP_SOV_A.html
          python docs/sovremenny/A/run_suite.py archive/v48/WIP_HELI_F2/Aegis_SIM_v48_WIP_HELI_F2.html Aegis_SIM_v48_WIP_SOV_A.html artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovremenny-a-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
