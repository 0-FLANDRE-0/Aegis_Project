name: Helicopter F2 step0 passive EMCON designation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_PATH: ${{ github.workspace }}/docs/performance/F/node_modules
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix docs/performance/F --ignore-scripts --no-audit --no-fund
          pip install -r docs/helicopter/F/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_HELI_F2_0.txt
          sha256sum -c docs/helicopter/K/REPOSITORY_SUPPORT.sha256
          python docs/helicopter/K/build.py archive/v48/WIP_HELI_CG_B/Aegis_SIM_v48_WIP_HELI_CG_B.html /tmp/HELI_F2_0.html
          python docs/helicopter/K/verify_static.py archive/v48/WIP_HELI_CG_B/Aegis_SIM_v48_WIP_HELI_CG_B.html Aegis_SIM_v48_WIP_HELI_F2_0.html artifacts/static
          python docs/helicopter/K/verify_native.py Aegis_SIM_v48_WIP_HELI_F2_0.html artifacts/native
          python docs/helicopter/K/verify_ui.py Aegis_SIM_v48_WIP_HELI_F2_0.html artifacts/ui
          python docs/helicopter/F/verify_regression.py archive/v48/WIP_HELI_CG_B/Aegis_SIM_v48_WIP_HELI_CG_B.html Aegis_SIM_v48_WIP_HELI_F2_0.html artifacts/regression --baseline-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helicopter-f2-0-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
