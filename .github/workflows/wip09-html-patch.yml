name: WIP09 one-time HTML patch

on:
  push:
    branches:
      - v48-wip09-ship-profile
    paths:
      - .github/workflows/wip09-html-patch.yml
      - .github/wip09-html.patch

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out WIP09 branch
        uses: actions/checkout@v4
        with:
          ref: v48-wip09-ship-profile

      - name: Apply verified WIP08 to WIP09 delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v48-wip09-ship-profile"
          before_sha="$(sha256sum Aegis_SIM_v48_WIP08.html | awk '{print $1}')"
          test "$before_sha" = "fe537db57d08f7c87120ed80a6118acd7c83389e75169e3fde9d404834f67eb8"

          cp Aegis_SIM_v48_WIP08.html Aegis_SIM_v48_WIP09.html
          git apply .github/wip09-html.patch

          after_sha="$(sha256sum Aegis_SIM_v48_WIP09.html | awk '{print $1}')"
          test "$after_sha" = "0fe806267435d2562408e638246a353b93ddf9c7e6295914f12cf83ec684b54f"

          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('Aegis_SIM_v48_WIP09.html', 'utf8');
          const scripts = [...source.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (scripts.length !== 1) throw new Error(`expected one inline script, got ${scripts.length}`);
          for (const match of scripts) new Function(match[1]);
          for (const marker of [
            'AEGIS_SHIP_PROFILE_V48_WIP09',
            'DDG_119_LATE_FLIGHT_IIA',
            'SHIP-PROFILE-V48-WIP09',
            'ACTIVE_SHIP_RUNTIME_V48_WIP09',
          ]) {
            if (!source.includes(marker)) throw new Error(`missing ${marker}`);
          }
          NODE

      - name: Commit WIP09 HTML only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Aegis_SIM_v48_WIP09.html
          test "$(git diff --cached --name-only)" = "Aegis_SIM_v48_WIP09.html"
          git commit -m "feat: add WIP09 ship profile simulator [skip ci]"
          git push origin HEAD:v48-wip09-ship-profile
