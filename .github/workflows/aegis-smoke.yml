  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate latest simulator source
        shell: bash
        run: |
          set -euo pipefail
          sim_file="$(find . -maxdepth 1 -type f -name 'Aegis_SIM_v*.html' -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$sim_file"
          SIM_FILE="$sim_file" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["SIM_FILE"])
          text = path.read_text(encoding="utf-8")
          required = (
              "<!doctype html>",
              "</html>",
              'id="external3DRadarBtn"',
              'id="external3DSpq9bBtn"',
              'id="external3DBridgeMasterEBtn"',
              'id="external3DInteriorBtn"',
          )
          missing = [marker for marker in required if marker.lower() not in text.lower()]
          if missing:
              raise SystemExit(f"{path}: missing markers: {missing}")
          if re.search(r"(?m)^(?:<<<<<<< .+|=======\\s*|>>>>>>> .+)$", text):
              raise SystemExit(f"{path}: unresolved merge conflict marker")
          print(f"validated {path} ({path.stat().st_size:,} bytes)")
          PY

      - name: Verify static HTTP serving
        shell: bash
        run: |
          set -euo pipefail
          sim_file="$(find . -maxdepth 1 -type f -name 'Aegis_SIM_v*.html' -printf '%f\n' | sort -V | tail -n 1)"
          cp "$sim_file" index.html
          python3 -m http.server 4173 >/tmp/aegis-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/aegis-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/aegis-index.html
          grep -qi '</html>' /tmp/aegis-index.html

  webgl-render-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Three.js WebGL probe
        shell: bash
        run: |
          cat > webgl-probe.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>AEGIS Actions WebGL probe</title>
            <style>
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141c;color:#d7f4ef;font:16px monospace}
              #status{position:fixed;left:12px;top:12px;z-index:2;padding:8px;background:#001018cc;border:1px solid #49c5a5}
              canvas{display:block;width:100%;height:100%}
            </style>
          </head>
          <body>
            <div id="status">BOOT</div>
            <canvas id="c"></canvas>
            <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
            <script>
              (function(){
                const status=document.getElementById('status');
                try{
                  if(!window.THREE) throw new Error('THREE_LOAD_FAILED');
                  const canvas=document.getElementById('c');
                  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
                  renderer.setSize(800,600,false);
                  renderer.setClearColor(0x07141c,1);
                  const scene=new THREE.Scene();
                  const camera=new THREE.PerspectiveCamera(55,800/600,0.1,100);
                  camera.position.set(2.8,2.1,4.0);
                  camera.lookAt(0,0,0);
                  scene.add(new THREE.HemisphereLight(0xbfffea,0x142030,2.2));
                  const key=new THREE.DirectionalLight(0xffffff,2.4);
                  key.position.set(3,4,5);
                  scene.add(key);
                  const cube=new THREE.Mesh(
                    new THREE.BoxGeometry(1.6,1.6,1.6),
                    new THREE.MeshStandardMaterial({color:0x38b48c,roughness:0.48,metalness:0.22})
                  );
                  cube.rotation.set(0.42,0.68,0.12);
                  scene.add(cube);
                  renderer.render(scene,camera);
                  const gl=renderer.getContext();
                  const pixel=new Uint8Array(4);
                  gl.readPixels(400,300,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
                  const dbg=gl.getExtension('WEBGL_debug_renderer_info');
                  const info={
                    three:THREE.REVISION,
                    webgl2:renderer.capabilities.isWebGL2,
                    version:gl.getParameter(gl.VERSION),
                    renderer:dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),
                    pixel:Array.from(pixel)
                  };
                  document.documentElement.dataset.webgl='PASS';
                  status.textContent='WEBGL_PASS '+JSON.stringify(info);
                }catch(err){
                  document.documentElement.dataset.webgl='FAIL';
                  status.textContent='WEBGL_FAIL '+(err&&err.stack||err);
                }
              })();
            </script>
          </body>
          </html>
          HTML

      - name: Render WebGL through Chromium SwiftShader
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_bin"
          "$chrome_bin" --version
          python3 -m http.server 4173 >/tmp/aegis-webgl-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/webgl-probe.html -o /dev/null && break
            sleep 0.25
          done
          flags=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --enable-webgl
            --ignore-gpu-blocklist
            --use-gl=angle
            --use-angle=swiftshader
            --enable-unsafe-swiftshader
            --window-size=800,600
            --virtual-time-budget=10000
          )
          dom="$("$chrome_bin" "${flags[@]}" --dump-dom http://127.0.0.1:4173/webgl-probe.html)"
          if ! grep -q 'data-webgl="PASS"' <<<"$dom"; then
            printf '%s\n' "$dom"
            exit 1
          fi
          grep -o 'WEBGL_PASS[^<]*' <<<"$dom"
          "$chrome_bin" "${flags[@]}" --screenshot=webgl-probe.png http://127.0.0.1:4173/webgl-probe.html
          test -s webgl-probe.png

      - name: Upload WebGL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-probe
          path: webgl-probe.png
          if-no-files-found: warn
          retention-days: 7

  aegis-3d-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare latest simulator
        shell: bash
        run: |
          set -euo pipefail
          sim_file="$(find . -maxdepth 1 -type f -name 'Aegis_SIM_v*.html' -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$sim_file"
          # Reconstruct the candidate from the frozen user upload until its HTML is uploaded.
          if test -f docs/wip16/B/build_wip16b.py && test -f Aegis_SIM_v48_WIP16A.html; then
            python docs/wip16/B/build_wip16b.py Aegis_SIM_v48_WIP16A.html /tmp/Aegis_SIM_v48_WIP16B.html
            if test -f Aegis_SIM_v48_WIP16B.html; then
              cmp Aegis_SIM_v48_WIP16B.html /tmp/Aegis_SIM_v48_WIP16B.html
            fi
            cp /tmp/Aegis_SIM_v48_WIP16B.html index.html
            sim_file=Aegis_SIM_v48_WIP16B.html
          else
            cp "$sim_file" index.html
          fi
          printf '%s\n' "$sim_file" > rendered-source.txt
          npm install --no-save --no-package-lock ws@8

      - name: Create bounded CDP capture script
        shell: bash
        run: |
          cat > cdp-capture.mjs <<'JS'
          import fs from 'node:fs';
          import WebSocket from 'ws';

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let targets = [];
          for (let attempt = 0; attempt < 160; attempt++) {
            try {
              targets = await (await fetch('http://127.0.0.1:9222/json')).json();
              if (targets.some(t => t.type === 'page' && t.url.includes('view3d=1'))) break;
            } catch {}
            await sleep(250);
          }
          const page = targets.find(t => t.type === 'page' && t.url.includes('view3d=1'));
          if (!page) throw new Error('CDP_PAGE_NOT_FOUND');

          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.once('open', resolve);
            ws.once('error', reject);
          });
          let seq = 0;
          const pending = new Map();
          ws.on('message', raw => {
            const msg = JSON.parse(String(raw));
            if (!msg.id || !pending.has(msg.id)) return;
            const { resolve, reject } = pending.get(msg.id);
            pending.delete(msg.id);
            if (msg.error) reject(new Error(JSON.stringify(msg.error)));
            else resolve(msg.result);
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++seq;
            pending.set(id, { resolve, reject });
            ws.send(JSON.stringify({ id, method, params }));
          });

          await send('Page.enable');
          await send('Runtime.enable');
          let runtimeReady = false;
          for (let attempt = 0; attempt < 240; attempt++) {
            const probe = await send('Runtime.evaluate', {
              expression: `!!window.__WIP148_3D_VIEW__?.ready && !!window.__NAVAL_SIM_DIAG__?.runV48Wip03StructuralProbe`,
              returnByValue: true
            });
            if (probe.result?.value) {
              runtimeReady = true;
              break;
            }
            await sleep(250);
          }
          if (!runtimeReady) throw new Error('AEGIS_3D_RUNTIME_NOT_READY');
          const setupExpression = `(() => {
            document.getElementById('wip125DepartBtn')?.click();
            const d = window.__NAVAL_SIM_DIAG__;
            d.ciwsB1Closure?.setPaused?.(true);
            const probe = d.runV48Wip03StructuralProbe({ hits: 2, label: 'Kh-32', xM: 12, zM: -3.5, side: 'STARBOARD' });
            const crewProbe = d.runV48Wip07CrewDamageProbe({ readCount: 0 });
            const authoritativeBefore = JSON.stringify({
              flood: d.damageFloodSnapshotV1(),
              structure: d.v48Wip03StructuralState(),
              visual: d.v48Wip03DamageVisualState(),
              interior: d.v48Wip06InteriorState(),
              crew: d.v48Wip07CrewState()
            });
            window.__V48_WIP03_3D_PROBE__ = { probe, crewProbe, authoritativeBefore };
            window.__WIP148_3D_VIEW__?.resetCamera?.();
            if (!window.__WIP148_3D_VIEW__?.interiorTopologyVisible) window.__WIP148_3D_VIEW__?.toggleInteriorTopology?.();
            return true;
          })()`;
          await send('Runtime.evaluate', { expression: setupExpression });
          for (let attempt = 0; attempt < 240; attempt++) {
            const probe = await send('Runtime.evaluate', {
              expression: `(() => { const v=window.__WIP148_3D_VIEW__,a=v?.damageAuditV48Wip03?.(),i=v?.interiorAuditV48Wip06?.(),c=v?.crewAuditV48Wip07?.(); return !!v?.ready && !!a && !a.pending && a.entry.length>0 && a.exit.length>0 && !!i?.visible && !!i?.allSpacesRepresented && !!i?.allPortalsRepresented && !!i?.allEquipmentRepresented && !!i?.verticalShellFilled && !!i?.superstructureContained && !!i?.batched && !!i?.exteriorTransparent && !!c?.visible && !!c?.allPersonnelRepresented && c?.instanceBatches===1; })()`,
              returnByValue: true
            });
            if (probe.result?.value) break;
            await sleep(250);
          }

          const expression = `(() => {
            const view = document.getElementById('external3DView');
            const readout = document.getElementById('external3DReadout');
            const loading = document.getElementById('external3DLoading');
            let rendererInfo = null;
            let ready = false;
            let auditPass = false;
            let damageAudit = null;
            let damageChecks = null;
            let interiorAudit = null;
            let interiorChecks = null;
            let crewAudit = null;
            let crewChecks = null;
            let bridgeMasterEAudit = null;
            let bridgeMasterEChecks = null;
            try {
              const view3d = window.__WIP148_3D_VIEW__;
              ready = !!view3d?.ready;
              auditPass = !!view3d?.contractAudit?.().pass;
              damageAudit = view3d?.damageAuditV48Wip03?.() || null;
              interiorAudit = view3d?.interiorAuditV48Wip06?.() || null;
              crewAudit = view3d?.crewAuditV48Wip07?.() || null;
              bridgeMasterEAudit = view3d?.bridgeMasterEAuditV48Wip08?.() || null;
              const setup = window.__V48_WIP03_3D_PROBE__;
              const d = window.__NAVAL_SIM_DIAG__;
              const authoritativeAfter = JSON.stringify({
                flood: d.damageFloodSnapshotV1(),
                structure: d.v48Wip03StructuralState(),
                visual: d.v48Wip03DamageVisualState(),
                interior: d.v48Wip06InteriorState(),
                crew: d.v48Wip07CrewState()
              });
              const openingById = new Map((setup?.probe?.flood?.openings || []).map(o => [o.id, o]));
              const entry = damageAudit?.entry || [], exit = damageAudit?.exit || [];
              const rows = [...entry, ...exit];
              damageChecks = {
                dualHullOpenings: damageAudit?.dualHullOpenings === true,
                entryExitPresent: entry.length > 0 && exit.length > 0,
                oppositeSides: entry.some(a => exit.some(b => a.point.y * b.point.y < 0)),
                meshMatched: rows.length > 0 && rows.every(r => r.meshMatched),
                actualHoles: rows.length > 0 && rows.every(r => r.actualHole),
                attached: rows.length > 0 && rows.every(r => r.attached),
                settled: damageAudit?.pending === false && damageAudit?.unmatched === 0,
                areaPreserved: rows.length > 0 && rows.every(r => {
                  const o = openingById.get(r.openingId);
                  return !!o && Math.abs(o.areaM2 - r.sourceAreaM2) < 1e-9;
                }),
                renderReadOnly: setup?.authoritativeBefore === authoritativeAfter
              };
              interiorChecks = {
                buttonPresent: interiorAudit?.buttonPresent === true,
                buttonPressed: interiorAudit?.buttonPressed === true,
                visible: interiorAudit?.visible === true,
                allSpacesRepresented: interiorAudit?.allSpacesRepresented === true && interiorAudit?.spaceMeshes === interiorAudit?.expectedSpaces,
                allPortalsRepresented: interiorAudit?.allPortalsRepresented === true && interiorAudit?.portalMeshes === interiorAudit?.expectedPortals,
                allEquipmentRepresented: interiorAudit?.allEquipmentRepresented === true && interiorAudit?.equipmentMeshes === interiorAudit?.expectedEquipment,
                verticalShellFilled: interiorAudit?.verticalShellFilled === true && interiorAudit?.representedBridgeDecks >= 5 && interiorAudit?.representedHangarDecks >= 2 && interiorAudit?.representedExhaustTrunks >= 12 && interiorAudit?.representedMastTrunks >= 3,
                superstructureContained: interiorAudit?.superstructureContained === true && interiorAudit?.superstructureOutsideVertices === 0,
                batchedDrawables: interiorAudit?.batched === true && interiorAudit?.interiorDrawables > 0 && interiorAudit?.interiorDrawables < interiorAudit?.legacyEstimatedDrawables,
                exteriorTransparent: interiorAudit?.exteriorTransparent === true && interiorAudit?.exteriorTransparentMaterials > 0,
                presentationOnly: interiorAudit?.presentationOnly === true && interiorAudit?.physicsFeedback === false,
                snapshotContract: interiorAudit?.renderContract === 'PRESENTATION_ONLY_TOPOLOGY_SNAPSHOT'
              };
              crewChecks = {
                schema: crewAudit?.schema === 'AEGIS_3D_CREW_AUDIT_V48_WIP07',
                visible: crewAudit?.visible === true,
                oneInstanceBatch: crewAudit?.instanceBatches === 1,
                exactRoster: crewAudit?.renderedPersonnel === 310 && crewAudit?.expectedPersonnel === 310,
                allPersonnelRepresented: crewAudit?.allPersonnelRepresented === true,
                presentationOnly: crewAudit?.presentationOnly === true && crewAudit?.physicsFeedback === false,
                snapshotContract: crewAudit?.renderContract === 'PRESENTATION_ONLY_CREW_SNAPSHOT',
                deterministicProbe: !!setup?.crewProbe?.checks && Object.values(setup.crewProbe.checks).every(Boolean)
              };
              bridgeMasterEChecks = {
                rendererReady: bridgeMasterEAudit?.rendererReady === true,
                meshPresent: bridgeMasterEAudit?.meshPresent === true,
                mountPresent: bridgeMasterEAudit?.mountPresent === true,
                meshAtAuthoritativeHardpoint: bridgeMasterEAudit?.meshAtAuthoritativeHardpoint === true,
                registeredMountPlacement: bridgeMasterEAudit?.model === 'BURKE_SIMSTYLE_C5_1' ? bridgeMasterEAudit?.registeredMastPlacement === true : bridgeMasterEAudit?.upperStarboardYardarm === true,
                rotorMirrorsAuthoritative: bridgeMasterEAudit?.rotorMirrorsAuthoritative === true,
                physicalHitbox: bridgeMasterEAudit?.physicalHitbox === true,
                sharedHardpoint: bridgeMasterEAudit?.sharedHardpoint === true,
                mastOutfitPresent: bridgeMasterEAudit?.mastOutfitPresent === true,
                mastOutfitBounded: bridgeMasterEAudit?.mastOutfitBounded === true && bridgeMasterEAudit?.mastOutfitDrawables === (bridgeMasterEAudit?.model === 'BURKE_SIMSTYLE_C5_1' ? 17 : 14),
                singleFunctionalRadar: bridgeMasterEAudit?.duplicateFunctionalRadar === false,
                publicSbandBaseline: bridgeMasterEAudit?.publicSbandBaseline === true,
                trackDisplayRangeSeparated: bridgeMasterEAudit?.trackDisplayRangeSeparated === true,
                presentationOnly: bridgeMasterEAudit?.presentationOnly === true && bridgeMasterEAudit?.physicsFeedback === false
              };
              const gl = view3d?.renderer?.getContext?.();
              if (gl) {
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                rendererInfo = {
                  webgl2: !!view3d.renderer.capabilities.isWebGL2,
                  version: gl.getParameter(gl.VERSION),
                  renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
                };
              }
            } catch (error) {
              rendererInfo = { error: String(error?.stack || error) };
            }
            return {
              active: !!view?.classList.contains('active'),
              three: window.THREE?.REVISION || null,
              ready,
              auditPass,
              damageAudit,
              damageChecks,
              interiorAudit,
              interiorChecks,
              crewAudit,
              crewChecks,
              bridgeMasterEAudit,
              bridgeMasterEChecks,
              rendererInfo,
              readout: readout?.textContent || null,
              loadingVisible: !!loading?.classList.contains('show'),
              canvas: {
                width: document.getElementById('external3DCanvas')?.width || 0,
                height: document.getElementById('external3DCanvas')?.height || 0
              }
            };
          })()`;
          const evaluated = await send('Runtime.evaluate', { expression, returnByValue: true });
          const state = evaluated.result?.value || { evaluationError: evaluated.exceptionDetails || null };
          fs.writeFileSync('aegis-3d-state.json', JSON.stringify(state, null, 2));

          const shot = await send('Page.captureScreenshot', {
            format: 'png',
            fromSurface: true,
            captureBeyondViewport: false
          });
          fs.writeFileSync('aegis-3d.png', Buffer.from(shot.data, 'base64'));
          console.log('AEGIS_3D_STATE '+JSON.stringify(state));
          ws.close();

          const damagePass = state.damageChecks && Object.values(state.damageChecks).every(Boolean);
          const interiorPass = state.interiorChecks && Object.values(state.interiorChecks).every(Boolean);
          const crewPass = state.crewChecks && Object.values(state.crewChecks).every(Boolean);
          const bridgeMasterEPass = state.bridgeMasterEChecks && Object.values(state.bridgeMasterEChecks).every(Boolean);
          if (!state.active || !state.three || !state.ready || !state.auditPass || !damagePass || !interiorPass || !crewPass || !bridgeMasterEPass || !state.rendererInfo?.version) {
            process.exitCode = 1;
          }
          JS

      - name: Render actual AEGIS 3D view
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_bin"
          python3 -m http.server 4173 >/tmp/aegis-3d-http.log 2>&1 &
          server_pid=$!
          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=1600,900 \
            --hide-scrollbars \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/aegis-chrome-profile \
            'http://127.0.0.1:4173/index.html?view3d=1' >/tmp/aegis-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" "$server_pid" 2>/dev/null || true' EXIT
          timeout 180s node cdp-capture.mjs
          test -s aegis-3d.png
          printf 'AEGIS_3D_CAPTURE_PASS %s\n' "$(cat rendered-source.txt)"

      - name: Upload AEGIS 3D proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-3d-render
          path: |
            aegis-3d.png
            aegis-3d-state.json
            rendered-source.txt
            /tmp/aegis-chrome.log
          if-no-files-found: warn
          retention-days: 7
