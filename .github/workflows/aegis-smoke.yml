name: AEGIS smoke check

on:
  pull_request:
    paths:
      - 'Aegis_SIM_v*.html'
      - '.github/workflows/aegis-smoke.yml'
      - 'tests/ciws-b1-closure.spec.js'
      - 'tests/ciws-b2-maneuver.spec.js'
      - 'tests/ciws-b3-damage.spec.js'
      - 'tests/ship-mass-ledger.spec.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIM_FILE: Aegis_SIM_v37.1_WIP14.html

jobs:
  ciws-b1-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run CIWS B1 closure in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ciws-b1-closure
          cp "$SIM_FILE" index.html
          python3 -m http.server 4173 >/tmp/aegis-ciws-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            curl --fail --silent http://127.0.0.1:4173/ -o /dev/null && break
            sleep 0.25
          done
          npm run test:ciws-b1

      - name: Record artifact SHA-256
        if: always()
        shell: bash
        run: |
          find artifacts/ciws-b1-closure -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 -r sha256sum \
            | tee artifacts/ciws-b1-closure/SHA256SUMS

      - name: Upload CIWS closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciws-b1-closure-${{ github.sha }}
          path: |
            artifacts/ciws-b1-closure/
            playwright-report/
            test-results/
            /tmp/aegis-ciws-http.log
          if-no-files-found: warn
          retention-days: 14

