name: AEGIS smoke check

on:
  pull_request:
    paths:
      - 'Aegis_SIM_v*.html'
      - '.github/workflows/aegis-smoke.yml'
      - 'tests/ciws-b1-closure.spec.js'
      - 'tests/ciws-b2-maneuver.spec.js'
      - 'tests/ciws-b3-damage.spec.js'
      - 'tests/ship-mass-ledger.spec.js'
      - 'tests/ship-impact-penetration.spec.js'
      - 'tests/ship-structural-fatigue.spec.js'
      - 'tests/ship-stability-maneuver.spec.js'
      - 'tests/ship-wave-flooding.spec.js'
      - 'tests/ship-interior-topology.spec.js'
      - 'tests/ship-crew-damage.spec.js'
      - 'tests/crew-wip07-contract.cjs'
      - 'tests/bridgemaster-e.spec.js'
      - 'tests/bridgemaster-e-contract.cjs'
      - 'tests/ship-profile.spec.js'
      - 'tests/ship-profile-contract.cjs'
      - 'tests/aft-geometry-wip10.spec.js'
      - 'tests/material-protection-wip11-contract.cjs'
      - 'tests/material-protection-wip11.spec.js'
      - 'tests/runtime-safety-wip11b-contract.cjs'
      - 'tests/runtime-safety-wip11b.spec.js'
      - 'tests/asm-wreckage-wip11c-contract.cjs'
      - 'tests/asm-wreckage-wip11c.spec.js'
      - 'tests/terminal-ballistics-wip12a-contract.cjs'
      - 'tests/terminal-ballistics-wip12a.spec.js'
      - 'tests/live-terminal-effects-wip12b-contract.cjs'
      - 'tests/live-terminal-effects-wip12b.spec.js'
      - 'tests/internal-terminal-effects-wip12c-contract.cjs'
      - 'tests/internal-terminal-effects-wip12c.spec.js'
      - 'tests/residual-overpenetration-wip12d-contract.cjs'
      - 'tests/residual-overpenetration-wip12d.spec.js'
      - 'tests/naval-armor-fuze-wip12e-rev5-contract.cjs'
      - 'tests/naval-armor-fuze-wip12e-rev5.spec.js'
      - 'tests/terminal-hardening-wip12f-contract.cjs'
      - 'tests/terminal-hardening-wip12f.spec.js'
      - 'WIP12F_SHA256SUMS.txt'
      - 'tests/wip10-visual-probe.cjs'
      - 'archive/v48/WIP11C/**'
      - 'archive/v48/WIP12A/**'
      - 'archive/v48/WIP12B/**'
      - 'archive/v48/WIP12C/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIM_FILE: Aegis_SIM_v48_WIP12D.html
  BASELINE_SIM_FILE: archive/v48/WIP10/Aegis_SIM_v48_WIP10.html
  SAFETY_BASELINE_SIM_FILE: archive/v48/WIP11A/Aegis_SIM_v48_WIP11A.html
  WRECK_BASELINE_SIM_FILE: archive/v48/WIP11B/Aegis_SIM_v48_WIP11B.html
  TERMINAL_BASELINE_SIM_FILE: archive/v48/WIP11C/Aegis_SIM_v48_WIP11C.html

jobs:
  ciws-b1-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run CIWS B1 closure in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ciws-b1-closure
          cp "$SIM_FILE" index.html
          python3 -m http.server 4173 >/tmp/aegis-ciws-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..40}; do
            curl --fail --silent http://127.0.0.1:4173/ -o /dev/null && break
            sleep 0.25
          done
          npm run test:ciws-b1

      - name: Record artifact SHA-256
        if: always()
        shell: bash
        run: |
          find artifacts/ciws-b1-closure -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 -r sha256sum \
            | tee artifacts/ciws-b1-closure/SHA256SUMS

      - name: Upload CIWS closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciws-b1-closure-${{ github.sha }}
          path: |
            artifacts/ciws-b1-closure/
            playwright-report/
            test-results/
            /tmp/aegis-ciws-http.log
          if-no-files-found: warn
          retention-days: 14

