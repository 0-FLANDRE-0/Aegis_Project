name: WIP09 exact source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-main-wip08:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact WIP08 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s Aegis_SIM_v48_WIP08.html
          sha256sum Aegis_SIM_v48_WIP08.html | tee WIP08_SHA256SUMS.txt
          stat --printf='%s bytes\n' Aegis_SIM_v48_WIP08.html
      - name: Upload WIP09 working source
        uses: actions/upload-artifact@v4
        with:
          name: wip09-working-source
          path: |
            Aegis_SIM_v48_WIP08.html
            WIP08_SHA256SUMS.txt
            AEGIS_PLAN_STATUS_v48_WIP08.md
            AEGIS_PROJECT_INSTRUCTIONS.md
            README.md
            package.json
            package-lock.json
            tests/
            .github/workflows/aegis-smoke.yml
          include-hidden-files: true
          retention-days: 1
