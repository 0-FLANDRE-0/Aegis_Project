name: Harpoon E prelaunch INS waypoints and terminal search
on:
  pull_request:
    paths:
      - 'Aegis_SIM_v48_WIP_HARPOON_E.html'
      - 'AEGIS_PLAN_STATUS_v48_WIP_HARPOON_E.md'
      - 'SHA256SUMS_v48_WIP_HARPOON_E.txt'
      - 'docs/harpoon/**'
      - '.github/workflows/harpoon-e.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  AEGIS_CANDIDATE: Aegis_SIM_v48_WIP_HARPOON_E.html
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy==2.3.5
      - name: Verify E and reconstruct unuploaded comparison D from K
        run: |
          sha256sum -c SHA256SUMS_v48_WIP_HARPOON_E.txt
          sha256sum -c docs/harpoon/E/REPOSITORY_SUPPORT.sha256
          python docs/harpoon/A/build.py --out artifacts/harpoon/baseline-A.html
          python docs/harpoon/B/build.py --baseline artifacts/harpoon/baseline-A.html --out artifacts/harpoon/baseline-B.html
          python docs/harpoon/C/build.py --baseline artifacts/harpoon/baseline-B.html --out artifacts/harpoon/baseline-C.html
          python docs/harpoon/D/build.py --baseline artifacts/harpoon/baseline-C.html --out artifacts/harpoon/baseline-D.html
          python docs/harpoon/E/verify_static.py "$AEGIS_CANDIDATE" artifacts/harpoon/static --baseline artifacts/harpoon/baseline-D.html
          python docs/harpoon/E/verify_guidance.py "$AEGIS_CANDIDATE" artifacts/harpoon/guidance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harpoon-e-static-${{ github.sha }}
          path: artifacts/harpoon
          if-no-files-found: error
  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [selection, routes, knowledge, clock, range, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/bunkerhill/K/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - name: Run declared fixture suite
        run: |
          if [ "${{ matrix.suite }}" = "selection" ]; then
            python docs/harpoon/D/verify_selection.py "$AEGIS_CANDIDATE" artifacts/harpoon/selection
          else
            python docs/harpoon/E/verify_${{ matrix.suite }}.py "$AEGIS_CANDIDATE" artifacts/harpoon/${{ matrix.suite }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harpoon-e-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/harpoon/${{ matrix.suite }}
          if-no-files-found: error
