name: PIP A (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_PATH: ${{ github.workspace }}/docs/performance/F/node_modules
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix docs/performance/F --ignore-scripts --no-audit --no-fund
          pip install -r docs/helicopter/F/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_PIP_A.txt
          sha256sum -c docs/pip/A/REPOSITORY_SUPPORT.sha256
          python docs/pip/A/adapt_map.py
          python docs/pip/A/build.py archive/v48/WIP_MAP_A/Aegis_SIM_v48_WIP_MAP_A.html /tmp/PIP_A.html
          cmp /tmp/PIP_A.html Aegis_SIM_v48_WIP_PIP_A.html
          python docs/pip/A/run_suite.py archive/v48/WIP_MAP_A/Aegis_SIM_v48_WIP_MAP_A.html Aegis_SIM_v48_WIP_PIP_A.html artifacts/pip-a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-a-${{ github.sha }}
          path: artifacts/pip-a
          if-no-files-found: error
