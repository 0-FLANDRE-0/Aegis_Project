name: WIP16B renderer regression
on:
  pull_request:
    paths:
      - 'docs/wip16/B/**'
      - '.github/workflows/wip16b-regression.yml'
      - 'Aegis_SIM_v48_WIP16B.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify candidate
        run: |
          python docs/wip16/B/build_wip16b.py Aegis_SIM_v48_WIP16A.html /tmp/Aegis_SIM_v48_WIP16B.html
          if test -f Aegis_SIM_v48_WIP16B.html; then
            cmp Aegis_SIM_v48_WIP16B.html /tmp/Aegis_SIM_v48_WIP16B.html
          else
            cp /tmp/Aegis_SIM_v48_WIP16B.html Aegis_SIM_v48_WIP16B.html
          fi
          python docs/wip16/B/tests/package16b.py Aegis_SIM_v48_WIP16B.html Aegis_SIM_v48_WIP16A.html > package16b.json
      - name: Verify renderer and recovery in Chromium
        run: python docs/wip16/B/tests/render16b.py Aegis_SIM_v48_WIP16B.html artifacts/wip16b/renderer
      - name: Verify unchanged Phalanx regression
        run: python docs/wip16/A/tests/runtime16a.py Aegis_SIM_v48_WIP16B.html > artifacts/wip16b/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wip16b-renderer
          path: |
            artifacts/wip16b
            package16b.json
          if-no-files-found: error
