name: Materialize WIP13

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wip13-materialize.yml"
      - "tools/wip13-html.patch"
      - "tools/wip13-payload/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Build final WIP13 tree
        if: ${{ hashFiles('tools/wip13-html.patch') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive/v37.1/WIP12 tests
          cp Aegis_SIM_v37.1_WIP12.html archive/v37.1/WIP12/
          cp AEGIS_PLAN_STATUS_v37.1_WIP12.md archive/v37.1/WIP12/
          cp Aegis_SIM_v37.1_WIP12.html Aegis_SIM_v37.1_WIP13.html
          patch --batch Aegis_SIM_v37.1_WIP13.html < tools/wip13-html.patch
          cp tools/wip13-payload/AEGIS_PLAN_STATUS_v37.1_WIP13.md .
          cp tools/wip13-payload/tests/*.js tests/
          rm Aegis_SIM_v37.1_WIP12.html AEGIS_PLAN_STATUS_v37.1_WIP12.md
          rm -rf tools/wip13-payload

      - name: Verify generated WIP13
        if: ${{ hashFiles('tools/wip13-html.patch') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Aegis_SIM_v37.1_WIP13.html | cut -d' ' -f1)" = "b9faba85b522b2696e2adc7e46479dac4dbeb1d0dc1bbd94f0a1b5e4037b28ca"
          test -s archive/v37.1/WIP12/Aegis_SIM_v37.1_WIP12.html
          test -s archive/v37.1/WIP12/AEGIS_PLAN_STATUS_v37.1_WIP12.md
          test ! -e Aegis_SIM_v37.1_WIP12.html

      - name: Commit generated files
        if: ${{ hashFiles('tools/wip13-html.patch') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm tools/wip13-html.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify CIWS Block 1B sensors in WIP13"
          git push origin "HEAD:${{ github.head_ref }}"
