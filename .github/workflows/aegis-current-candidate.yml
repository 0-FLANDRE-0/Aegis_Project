name: AEGIS current candidate

on:
  pull_request:
    paths:
      - 'AEGIS_CURRENT_PRODUCT.json'
      - 'Aegis_SIM_v48_WIP_EMITTER_A.html'
      - 'Aegis_SIM_v48_WIP_EMCON_B.html'
      - 'Aegis_SIM_v48_WIP_ESM_A.html'
      - 'Aegis_SIM_v48_WIP_SEEKER_UNIFY_U4.html'
      - 'Aegis_SIM_v48_WIP_HP_A.html'
      - 'Aegis_SIM_v48_WIP_INTEGRATION_BASELINE_A.html'
      - 'docs/electronic/emitter/A/build_product.py'
      - 'docs/electronic/emitter/A/build_stage_diagnostic.py'
      - 'docs/electronic/emitter/A/validate_current_product.py'
      - 'docs/electronic/emitter/A/run_candidate_static_gate.py'
      - 'docs/electronic/emitter/A/run_candidate_browser_gate.mjs'
      - 'docs/electronic/emitter/A/emitter_registry.js'
      - 'docs/electronic/emitter/A/emitter_runtime.js'
      - 'docs/electronic/emitter/A/baseline_diagnostic.js'
      - 'docs/electronic/emitter/A/d_diagnostic.js'
      - 'docs/electronic/emitter/A/final_diagnostic.js'
      - 'docs/electronic/emitter/A/closure_diagnostic.js'
      - 'docs/electronic/emcon/B/build_product.py'
      - 'docs/electronic/emcon/B/build_stage_e_diagnostic.py'
      - 'docs/electronic/emcon/B/run_candidate_static_gate.py'
      - 'docs/electronic/emcon/B/run_candidate_baseline_gate.mjs'
      - 'docs/electronic/emcon/B/run_stage_e_static.py'
      - 'docs/electronic/emcon/B/run_stage_e_gate.mjs'
      - 'docs/electronic/emcon/B/run_stage_d_gate.mjs'
      - 'docs/electronic/emcon/B/run_correction_2_static.py'
      - 'docs/electronic/emcon/B/run_correction_2_gate.mjs'
      - 'docs/electronic/emcon/B/run_correction_2_release_smoke.mjs'
      - 'docs/electronic/emcon/B/correction_2_diagnostic.js'
      - 'docs/electronic/emcon/B/run_correction_3_static.py'
      - 'docs/electronic/emcon/B/run_correction_3_gate.mjs'
      - 'docs/electronic/emcon/B/correction_3_diagnostic.js'
      - 'docs/electronic/emcon/B/emcon_consumer_bindings.js'
      - 'docs/electronic/emcon/B/emcon_policy.js'
      - 'docs/electronic/emcon/B/emcon_active_runtime.js'
      - 'docs/electronic/emcon/B/emcon_ui.js'
      - 'docs/electronic/emcon/B/emcon_lifecycle.js'
      - 'docs/electronic/emcon/B/stage_e_diagnostic.js'
      - 'docs/electronic/esm/A/**'
      - 'docs/missile/seeker-unify/U4/**'
      - 'docs/damage/hp/A/**'
      - 'docs/missile/seeker-close/A/**'
      - 'docs/ooda/integration-baseline/A/integration_baseline_patch.py'
      - 'docs/ooda/integration-baseline/A/baseline_audit.py'
      - 'docs/ooda/integration-baseline/A/baseline_oracle.cjs'
      - 'docs/ooda/integration-baseline/A/contract_oracle.cjs'
      - 'Aegis_SIM_v48_WIP_SEEKER_CLOSE_A_REPORT.zip'
      - '.github/workflows/aegis-current-candidate.yml'
      - 'docs/pip/B/browser_backend.py'
      - 'docs/bunkerhill/K/browser_i.py'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository once
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked Playwright and Chromium
        run: |
          npm ci
          python3 -m pip install playwright==1.55.0
          npx playwright install --with-deps chromium

      - name: Validate current product manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/current-candidate
          python3 docs/electronic/emitter/A/validate_current_product.py \
            --out artifacts/current-candidate/manifest-validation.json
          node - <<'NODE' >> "$GITHUB_ENV"
          const m = require('./AEGIS_CURRENT_PRODUCT.json');
          console.log(`CANDIDATE_STAGE=${m.stage}`);
          console.log(`PRODUCT_PATH=${m.path}`);
          console.log(`BASELINE_PATH=${m.baselinePath}`);
          NODE

      - name: Rebuild manifest-selected candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          case "$CANDIDATE_STAGE" in
            EMITTER_A)
              python3 docs/electronic/emitter/A/build_product.py \
                --stage D --mode ACTIVE \
                --out /tmp/aegis-current-candidate.html \
                --receipt artifacts/current-candidate/rebuild.json \
                --diff artifacts/current-candidate/rebuild.diff
              python3 docs/electronic/emitter/A/verify_scope.py \
                --product "$PRODUCT_PATH" --stage D \
                --out artifacts/current-candidate/scope.json
              ;;
            EMCON_B)
              python3 docs/electronic/emcon/B/build_product.py \
                --stage E \
                --out /tmp/aegis-current-candidate.html \
                --receipt artifacts/current-candidate/rebuild.json \
                --diff artifacts/current-candidate/rebuild.diff
              ;;
            ESM_A)
              python3 docs/electronic/esm/A/build_product.py \
                --stage E \
                --out /tmp/aegis-current-candidate.html \
                --receipt artifacts/current-candidate/rebuild.json \
                --diff artifacts/current-candidate/rebuild.diff
              ;;
            SEEKER_UNIFY_U4)
              python3 docs/missile/seeker-unify/U4/build_product.py \
                --through C --mode ACTIVE \
                --out /tmp/aegis-current-candidate.html \
                --receipt artifacts/current-candidate/rebuild.json \
                --diff artifacts/current-candidate/rebuild.diff
              ;;
            HP_A)
              python3 docs/damage/hp/A/build_product.py \
                --phase C \
                --out /tmp/aegis-current-candidate.html \
                --receipt artifacts/current-candidate/rebuild.json
              ;;
            INTEGRATION_BASELINE_A)
              python3 docs/ooda/integration-baseline/A/integration_baseline_patch.py \
                "$BASELINE_PATH" /tmp/aegis-current-candidate.html \
                --js-output artifacts/current-candidate/main.js \
                > artifacts/current-candidate/rebuild.txt
              ;;
            *) echo "unknown candidate stage: $CANDIDATE_STAGE" >&2; exit 2 ;;
          esac
          cmp "$PRODUCT_PATH" /tmp/aegis-current-candidate.html

      - name: Audit script, JSON and ACTIVE call structure
        shell: bash
        run: |
          set -euo pipefail
          case "$CANDIDATE_STAGE" in
            EMITTER_A)
              python3 docs/electronic/emitter/A/run_candidate_static_gate.py \
                --out artifacts/current-candidate/static-gate.json \
                --main-out artifacts/current-candidate/main.js
              ;;
            EMCON_B)
              python3 docs/electronic/emcon/B/run_candidate_static_gate.py \
                --out artifacts/current-candidate/static-gate.json \
                --main-out artifacts/current-candidate/main.js
              python3 docs/electronic/emcon/B/run_stage_e_static.py
              cp docs/electronic/emcon/B/E_STATIC.json artifacts/current-candidate/stage-e-static.json
              python3 docs/electronic/emcon/B/run_correction_2_static.py
              cp docs/electronic/emcon/B/CORRECTION_2_STATIC.json artifacts/current-candidate/correction-2-static.json
              python3 docs/electronic/emcon/B/run_correction_3_static.py
              cp docs/electronic/emcon/B/CORRECTION_3_STATIC.json artifacts/current-candidate/correction-3-static.json
              ;;
            ESM_A)
              python3 docs/electronic/esm/A/run_candidate_static_gate.py \
                --out artifacts/current-candidate/static-gate.json \
                --main-out artifacts/current-candidate/main.js
              ;;
            SEEKER_UNIFY_U4)
              python3 docs/missile/seeker-unify/U4/run_candidate_static_gate.py \
                --product "$PRODUCT_PATH" \
                --out artifacts/current-candidate/static-gate.json \
                --main-out artifacts/current-candidate/main.js
              ;;
            HP_A)
              python3 docs/damage/hp/A/audit_candidate.py \
                --out artifacts/current-candidate/static-gate.json \
                --tsv artifacts/current-candidate/hp-consumer-audit.tsv \
                --main-out artifacts/current-candidate/main.js
              ;;
            INTEGRATION_BASELINE_A)
              python3 docs/ooda/integration-baseline/A/baseline_audit.py \
                "$PRODUCT_PATH" artifacts/current-candidate/static-gate.json \
                --stage INTEGRATION_BASELINE_A_ACTIONS
              ;;
            *) echo "unknown candidate stage: $CANDIDATE_STAGE" >&2; exit 2 ;;
          esac
          node --check artifacts/current-candidate/main.js

      - name: Build disposable candidate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          case "$CANDIDATE_STAGE" in
            EMITTER_A)
              python3 docs/electronic/emitter/A/build_stage_diagnostic.py \
                --base "$PRODUCT_PATH" \
                --out /tmp/aegis-current-candidate-diagnostic.html \
                --receipt artifacts/current-candidate/diagnostic-build.json \
                --extra docs/electronic/emitter/A/d_diagnostic.js \
                --extra docs/electronic/emitter/A/final_diagnostic.js \
                --extra docs/electronic/emitter/A/closure_diagnostic.js
              ;;
            EMCON_B)
              python3 docs/electronic/emcon/B/build_stage_e_diagnostic.py
              cp /tmp/Aegis_SIM_v48_WIP_EMCON_B_E_DIAGNOSTIC.html /tmp/aegis-current-candidate-diagnostic.html
              cp docs/electronic/emcon/B/E_DIAGNOSTIC_BUILD.json artifacts/current-candidate/diagnostic-build.json
              ;;
            ESM_A)
              python3 docs/electronic/esm/A/build_diagnostic.py \
                --product "$PRODUCT_PATH" \
                --out /tmp/Aegis_SIM_v48_WIP_ESM_A_E_DIAG.html \
                --modules esm_b_diagnostic.js esm_e_baseline_probe.js esm_e_diagnostic.js \
                --receipt artifacts/current-candidate/diagnostic-build.json
              python3 docs/electronic/esm/A/build_diagnostic.py \
                --product "$BASELINE_PATH" \
                --out /tmp/Aegis_SIM_v48_WIP_EMCON_B_E_BASELINE_DIAG.html \
                --modules esm_e_baseline_probe.js \
                --receipt artifacts/current-candidate/baseline-diagnostic-build.json
              cp "$PRODUCT_PATH" /tmp/Aegis_SIM_v48_WIP_ESM_A_E.html
              cp /tmp/Aegis_SIM_v48_WIP_ESM_A_E_DIAG.html /tmp/aegis-current-candidate-diagnostic.html
              cp /tmp/Aegis_SIM_v48_WIP_EMCON_B_E_BASELINE_DIAG.html /tmp/aegis-current-baseline-diagnostic.html
              ;;
            SEEKER_UNIFY_U4)
              cp "$PRODUCT_PATH" /tmp/aegis-current-candidate-diagnostic.html
              cp "$BASELINE_PATH" /tmp/aegis-current-baseline-diagnostic.html
              python3 docs/missile/seeker-unify/U4/build_product.py \
                --through C --mode SHADOW \
                --out /tmp/aegis-current-u4-shadow.html \
                --receipt artifacts/current-candidate/shadow-rebuild.json \
                --diff artifacts/current-candidate/shadow-rebuild.diff
              cp artifacts/current-candidate/rebuild.json artifacts/current-candidate/diagnostic-build.json
              ;;
            HP_A)
              cp "$PRODUCT_PATH" /tmp/aegis-current-candidate-diagnostic.html
              cp "$BASELINE_PATH" /tmp/aegis-current-baseline-diagnostic.html
              cp artifacts/current-candidate/rebuild.json artifacts/current-candidate/diagnostic-build.json
              ;;
            INTEGRATION_BASELINE_A)
              cp "$PRODUCT_PATH" /tmp/aegis-current-candidate-diagnostic.html
              cp "$BASELINE_PATH" /tmp/aegis-current-baseline-diagnostic.html
              cp artifacts/current-candidate/static-gate.json artifacts/current-candidate/diagnostic-build.json
              ;;
            *) echo "unknown candidate stage: $CANDIDATE_STAGE" >&2; exit 2 ;;
          esac
          if [ "$CANDIDATE_STAGE" != "ESM_A" ] && [ "$CANDIDATE_STAGE" != "SEEKER_UNIFY_U4" ] && [ "$CANDIDATE_STAGE" != "HP_A" ] && [ "$CANDIDATE_STAGE" != "INTEGRATION_BASELINE_A" ]; then
            python3 docs/electronic/emitter/A/build_stage_diagnostic.py \
                --base "$BASELINE_PATH" \
                --out /tmp/aegis-current-baseline-diagnostic.html \
                --receipt artifacts/current-candidate/baseline-diagnostic-build.json
          fi

      - name: Run final limited Chromium candidate gate
        shell: bash
        run: |
          set -euo pipefail
          case "$CANDIDATE_STAGE" in
            EMITTER_A)
              node docs/electronic/emitter/A/run_candidate_browser_gate.mjs \
                --html /tmp/aegis-current-candidate-diagnostic.html \
                --baseline-html /tmp/aegis-current-baseline-diagnostic.html \
                --out artifacts/current-candidate/browser-gate.json
              ;;
            EMCON_B)
              node docs/electronic/emcon/B/run_candidate_baseline_gate.mjs \
                --html /tmp/aegis-current-candidate-diagnostic.html \
                --baseline-html /tmp/aegis-current-baseline-diagnostic.html \
                --out artifacts/current-candidate/browser-baseline-gate.json
              EMCON_B_E_DIAGNOSTIC_HTML=/tmp/aegis-current-candidate-diagnostic.html \
                node docs/electronic/emcon/B/run_correction_2_gate.mjs
              cp docs/electronic/emcon/B/CORRECTION_2_GATE.json artifacts/current-candidate/correction-2-gate.json
              EMCON_B_E_DIAGNOSTIC_HTML=/tmp/aegis-current-candidate-diagnostic.html \
                node docs/electronic/emcon/B/run_correction_3_gate.mjs
              cp docs/electronic/emcon/B/CORRECTION_3_GATE.json artifacts/current-candidate/correction-3-gate.json
              EMCON_B_E_DIAGNOSTIC_HTML=/tmp/aegis-current-candidate-diagnostic.html \
                node docs/electronic/emcon/B/run_stage_d_gate.mjs
              cp docs/electronic/emcon/B/D_GATE.json artifacts/current-candidate/stage-d-gate.json
              AEGIS_CHROMIUM_EXECUTABLE="${AEGIS_CHROMIUM_EXECUTABLE:-}" \
                EMCON_B_PRODUCT_HTML="$PRODUCT_PATH" \
                node docs/electronic/emcon/B/run_correction_2_release_smoke.mjs
              cp docs/electronic/emcon/B/CORRECTION_2_RELEASE_SMOKE.json artifacts/current-candidate/correction-2-release-smoke.json
              EMCON_B_E_DIAGNOSTIC_HTML=/tmp/aegis-current-candidate-diagnostic.html \
                node docs/electronic/emcon/B/run_stage_e_gate.mjs
              cp docs/electronic/emcon/B/E_GATE.json artifacts/current-candidate/browser-gate.json
              EMCON_B_E_DIAGNOSTIC_HTML=/tmp/aegis-current-candidate-diagnostic.html \
                node docs/electronic/emcon/B/run_lock_debt_gate.mjs
              cp docs/electronic/emcon/B/LOCK_DEBT_14.json artifacts/current-candidate/lock-debt-14.json
              ;;
            ESM_A)
              python3 docs/electronic/esm/A/run_stage_e_gate.py
              cp docs/electronic/esm/A/E_GATE.json artifacts/current-candidate/browser-gate.json
              python3 docs/map/E/verify_emcon_ui.py \
                "$PRODUCT_PATH" artifacts/current-candidate/current-emcon-ui
              ;;
            SEEKER_UNIFY_U4)
              python3 docs/missile/seeker-unify/U4/run_c_gate.py \
                --baseline "$BASELINE_PATH" \
                --shadow /tmp/aegis-current-u4-shadow.html \
                --active "$PRODUCT_PATH" \
                --out artifacts/current-candidate/browser-gate.json
              ;;
            HP_A)
              python3 docs/damage/hp/A/run_contract_gate.py \
                "$PRODUCT_PATH" artifacts/current-candidate/browser-gate.json
              ;;
            INTEGRATION_BASELINE_A)
              python3 -m http.server 8123 --bind 127.0.0.1 \
                > artifacts/current-candidate/http-server.log 2>&1 &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' EXIT
              node docs/ooda/integration-baseline/A/baseline_oracle.cjs \
                "$BASELINE_PATH" "http://127.0.0.1:8123/$BASELINE_PATH" \
                artifacts/current-candidate/baseline-oracle.json
              node docs/ooda/integration-baseline/A/baseline_oracle.cjs \
                "$PRODUCT_PATH" "http://127.0.0.1:8123/$PRODUCT_PATH" \
                artifacts/current-candidate/candidate-oracle.json
              node docs/ooda/integration-baseline/A/contract_oracle.cjs \
                "$PRODUCT_PATH" "http://127.0.0.1:8123/$PRODUCT_PATH" \
                artifacts/current-candidate/browser-gate.json
              node docs/ooda/integration-baseline/A/contract_oracle.cjs \
                "$PRODUCT_PATH" "http://127.0.0.1:8123/$PRODUCT_PATH" \
                artifacts/current-candidate/contract-repeat.json
              node - <<'NODE'
              const fs = require('node:fs');
              const baseline = JSON.parse(fs.readFileSync('artifacts/current-candidate/baseline-oracle.json'));
              const candidate = JSON.parse(fs.readFileSync('artifacts/current-candidate/candidate-oracle.json'));
              const contract = JSON.parse(fs.readFileSync('artifacts/current-candidate/browser-gate.json'));
              const contractRepeat = JSON.parse(fs.readFileSync('artifacts/current-candidate/contract-repeat.json'));
              if (candidate.deterministicDigest !== baseline.deterministicDigest) throw Error('baseline/candidate oracle digest mismatch');
              if (contract.deterministicDigest !== contractRepeat.deterministicDigest) throw Error('contract oracle repeat mismatch');
              const owners = contract.owners || [];
              const mismatch = owners.reduce((n, q) => n + (q.active?.diagnostics?.shadowMismatchCount || 0) + (q.foreign?.diagnostics?.shadowMismatchCount || 0), 0);
              const errors = owners.reduce((n, q) => n + (q.browser?.consoleErrors?.length || 0) + (q.browser?.pageErrors?.length || 0), 0);
              const oracleErrors = [...(baseline.owners || []), ...(candidate.owners || [])]
                .reduce((n, q) => n + (q.result?.browser?.consoleErrors?.length || 0) + (q.result?.browser?.pageErrors?.length || 0), 0);
              if (owners.length !== 2 || mismatch !== 0 || errors !== 0) throw Error('contract gate failed');
              if (oracleErrors !== 0) throw Error('baseline/candidate oracle console error');
              if (owners.some(q => q.forbidden.length || !q.readOnly.rngExact || !q.readOnly.saveExact)) throw Error('read-only/truth audit failed');
              NODE
              ;;
            *) echo "unknown candidate stage: $CANDIDATE_STAGE" >&2; exit 2 ;;
          esac
          sha256sum "$PRODUCT_PATH" "$BASELINE_PATH" \
            > artifacts/current-candidate/SHA256SUMS

      - name: Upload current-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-current-candidate-${{ github.sha }}
          path: artifacts/current-candidate/
          if-no-files-found: error
          retention-days: 30

  seeker-close-closure-gate:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.number == 78) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'seeker-close-a')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact closure head
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked Playwright and Chromium
        run: |
          npm ci
          python3 -m pip install playwright==1.55.0
          npx playwright install --with-deps chromium

      - name: Verify unchanged HP_A authority product
        shell: bash
        run: |
          set -euo pipefail
          product=Aegis_SIM_v48_WIP_HP_A.html
          test "$(wc -c < "$product")" -eq 22200135
          echo "9121c44884ff808b295a4ddff61af93a3ed47f6e8c63956acf7a3339d24836fa  $product" | sha256sum -c -
          mkdir -p artifacts/seeker-close/limited artifacts/seeker-close/hp-contract

      - name: Rebuild diagnostic HTML exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/missile/seeker-close/A/build_diagnostic.py \
            Aegis_SIM_v48_WIP_HP_A.html \
            /tmp/Aegis_SIM_v48_DIAGNOSTIC_SEEKER_CLOSE_A.html \
            --receipt artifacts/seeker-close/DIAGNOSTIC_BUILD.json
          cmp docs/missile/seeker-close/A/DIAGNOSTIC_BUILD.json \
            artifacts/seeker-close/DIAGNOSTIC_BUILD.json

      - name: Run corrected 19-shot Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR=/dev/shm python3 docs/missile/seeker-close/A/run_diagnostics.py \
            /tmp/Aegis_SIM_v48_DIAGNOSTIC_SEEKER_CLOSE_A.html \
            artifacts/seeker-close/limited \
            --receipt artifacts/seeker-close/DIAGNOSTIC_BUILD.json \
            --compare-results docs/missile/seeker-close/A/evidence/limited/RESULTS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('artifacts/seeker-close/limited/SEMANTIC_COMPARE.json').read_text())
          assert row['status']=='PASS' and row['mismatchCount']==0
          assert row['contract']['containersStringsBooleansIntegers']=='EXACT'
          assert row['contract']['gameplayToleranceChanged'] is False
          assert row['contract']['evidenceRewrittenOrRounded'] is False
          PY

      - name: Preserve HP_A outcome and save contract 19 of 19
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/damage/hp/A/run_contract_gate.py \
            Aegis_SIM_v48_WIP_HP_A.html \
            artifacts/seeker-close/hp-contract/contract-gate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('artifacts/seeker-close/hp-contract/contract-gate.json').read_text())
          assert row['status']=='PASS'
          assert len(row['checks'])==19 and all(row['checks'].values())
          PY

      - name: Rebuild and verify HTML-free report package
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/missile/seeker-close/A/package_report.py \
            Aegis_SIM_v48_WIP_HP_A.html \
            /tmp/Aegis_SIM_v48_WIP_SEEKER_CLOSE_A_REPORT.zip \
            > artifacts/seeker-close/PACKAGE_RECEIPT.json
          cmp /tmp/Aegis_SIM_v48_WIP_SEEKER_CLOSE_A_REPORT.zip \
            Aegis_SIM_v48_WIP_SEEKER_CLOSE_A_REPORT.zip
          unzip -t /tmp/Aegis_SIM_v48_WIP_SEEKER_CLOSE_A_REPORT.zip
          if unzip -Z1 /tmp/Aegis_SIM_v48_WIP_SEEKER_CLOSE_A_REPORT.zip | grep -Eiq '\.html?$'; then
            echo 'report package unexpectedly contains HTML' >&2
            exit 1
          fi
          git diff --exit-code -- \
            docs/missile/seeker-close/A/PACKAGE_MANIFEST.md \
            docs/missile/seeker-close/A/CHECKSUMS.sha256

      - name: Upload SEEKER_CLOSE_A closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-seeker-close-a-${{ github.sha }}
          path: artifacts/seeker-close/
          if-no-files-found: error
          retention-days: 30
