name: WIP08 3D audit scope hotfix

on:
  push:
    branches:
      - v48-wip08-bridgemaster-e
    paths:
      - '.github/workflows/wip08-audit-scope-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v48-wip08-bridgemaster-e

      - name: Scope the WIP08 numeric comparator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Aegis_SIM_v48_WIP08.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('    bridgeMasterEAuditV48Wip08(){')
          end = text.index('    contractAudit(){', start)
          block = text[start:end]

          if block.count('near(') != 16:
              raise SystemExit(f'unexpected WIP08 audit near() count: {block.count("near(")}')

          needle = "renderHp=shipGameRenderPointV1(BRIDGEMASTER_E_INSTALLATION.xM,BRIDGEMASTER_E_INSTALLATION.yM,BRIDGEMASTER_E_INSTALLATION.zM),shared="
          replacement = "renderHp=shipGameRenderPointV1(BRIDGEMASTER_E_INSTALLATION.xM,BRIDGEMASTER_E_INSTALLATION.yM,BRIDGEMASTER_E_INSTALLATION.zM),nearWip08=(a,b,t=1e-9)=>Math.abs(Number(a)-Number(b))<=t,shared="
          if block.count(needle) != 1:
              raise SystemExit(f'unexpected comparator insertion count: {block.count(needle)}')

          block = block.replace(needle, replacement, 1).replace('near(', 'nearWip08(')
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          node tests/bridgemaster-e-contract.cjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Aegis_SIM_v48_WIP08.html
          git commit -m "Scope WIP08 3D audit comparator [skip ci]"
          git push origin HEAD:v48-wip08-bridgemaster-e
