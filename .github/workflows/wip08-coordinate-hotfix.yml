name: WIP08 coordinate-frame hotfix

on:
  push:
    branches:
      - v48-wip08-bridgemaster-e
    paths:
      - '.github/workflows/wip08-coordinate-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v48-wip08-bridgemaster-e

      - name: Apply coordinate-frame contract fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Aegis_SIM_v48_WIP08.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  """      const q=wip204AuxRadarBeamRenderStates(),spq=q.spq9b??[],bme=q.bridgeMasterE??[];
          """,
                  """      const q=wip204AuxRadarBeamRenderStates(),spq=q.spq9b??[],bme=q.bridgeMasterE??[];
                const bmeRenderExpected=shipGameRenderPointV1(BRIDGEMASTER_E_INSTALLATION.xM,BRIDGEMASTER_E_INSTALLATION.yM,BRIDGEMASTER_E_INSTALLATION.zM);
          """
              ),
              (
                  """      if(bme.some(b=>!near(b.xM,BRIDGEMASTER_E_INSTALLATION.xM)||!near(b.yM,BRIDGEMASTER_E_INSTALLATION.yM)||!near(b.zM,BRIDGEMASTER_E_INSTALLATION.zM)))failures.push('WIP08 BridgeMaster E renderer hardpoint drift');
          """,
                  """      if(bme.some(b=>b.sourceFrame!=='SHIP_BODY_X_BOW_Y_STARBOARD_Z_UP'||!near(b.sourceXM,BRIDGEMASTER_E_INSTALLATION.xM)||!near(b.sourceYM,BRIDGEMASTER_E_INSTALLATION.yM)||!near(b.sourceZM,BRIDGEMASTER_E_INSTALLATION.zM)||!near(b.xM,bmeRenderExpected.xM)||!near(b.yM,bmeRenderExpected.yM)||!near(b.zM,bmeRenderExpected.zM)))failures.push('WIP08 BridgeMaster E renderer hardpoint drift');
          """
              ),
              (
                  """      id:'BRIDGEMASTER_E:0',sensor:'BRIDGEMASTER_E',label:'BridgeMaster E',panel:0,panels:1,...bmeOrigin,
                azRelRad:angNorm(bridgeMasterERotorAngle),elRad:0,
          """,
                  """      id:'BRIDGEMASTER_E:0',sensor:'BRIDGEMASTER_E',label:'BridgeMaster E',panel:0,panels:1,...bmeOrigin,
                sourceFrame:'SHIP_BODY_X_BOW_Y_STARBOARD_Z_UP',sourceXM:BRIDGEMASTER_E_INSTALLATION.xM,sourceYM:BRIDGEMASTER_E_INSTALLATION.yM,sourceZM:BRIDGEMASTER_E_INSTALLATION.zM,
                azRelRad:angNorm(bridgeMasterERotorAngle),elRad:0,
          """
              ),
              (
                  """outfit=this.mastOutfitV48Wip08??null,shared=!!hp&&!!b&&near(hp.xM,b.xM)&&near(hp.yM,b.yM)&&near(hp.zM,b.zM)&&near(hp.xM,BRIDGEMASTER_E_INSTALLATION.xM)&&near(hp.yM,BRIDGEMASTER_E_INSTALLATION.yM)&&near(hp.zM,BRIDGEMASTER_E_INSTALLATION.zM),meshAtHardpoint=""",
                  """outfit=this.mastOutfitV48Wip08??null,renderHp=shipGameRenderPointV1(BRIDGEMASTER_E_INSTALLATION.xM,BRIDGEMASTER_E_INSTALLATION.yM,BRIDGEMASTER_E_INSTALLATION.zM),shared=!!hp&&!!b&&near(hp.xM,BRIDGEMASTER_E_INSTALLATION.xM)&&near(hp.yM,BRIDGEMASTER_E_INSTALLATION.yM)&&near(hp.zM,BRIDGEMASTER_E_INSTALLATION.zM)&&b.sourceFrame==='SHIP_BODY_X_BOW_Y_STARBOARD_Z_UP'&&near(b.sourceXM,BRIDGEMASTER_E_INSTALLATION.xM)&&near(b.sourceYM,BRIDGEMASTER_E_INSTALLATION.yM)&&near(b.sourceZM,BRIDGEMASTER_E_INSTALLATION.zM)&&near(b.xM,renderHp.xM)&&near(b.yM,renderHp.yM)&&near(b.zM,renderHp.zM),meshAtHardpoint="""
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node tests/bridgemaster-e-contract.cjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Aegis_SIM_v48_WIP08.html
          git commit -m "Fix WIP08 renderer coordinate-frame audit [skip ci]"
          git push origin HEAD:v48-wip08-bridgemaster-e
