name: UI A1 compact (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_PATH: ${{ github.workspace }}/docs/performance/F/node_modules
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --prefix docs/performance/F --ignore-scripts --no-audit --no-fund
          pip install -r docs/helicopter/F/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Use installed Chromium
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              with open(os.environ['GITHUB_ENV'], 'a') as out:
                  out.write('AEGIS_CHROMIUM_EXECUTABLE=' + pw.chromium.executable_path + '\n')
          PY
      - run: |
          sha256sum -c SHA256SUMS_v48_WIP_UI_A1.txt
          sha256sum -c docs/ui/A1/REPOSITORY_SUPPORT.sha256
          python docs/ui/A1/build.py archive/v48/WIP_UI_A/Aegis_SIM_v48_WIP_UI_A.html /tmp/UI_A1.html
          cmp /tmp/UI_A1.html Aegis_SIM_v48_WIP_UI_A1.html
          python docs/ui/A1/run_suite.py archive/v48/WIP_UI_A/Aegis_SIM_v48_WIP_UI_A.html Aegis_SIM_v48_WIP_UI_A1.html artifacts/ui-a1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-a1-${{ github.sha }}
          path: artifacts/ui-a1
          if-no-files-found: error
