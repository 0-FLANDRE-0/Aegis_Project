name: Materialize v48 WIP02

on:
  pull_request:
    paths:
      - '.github/workflows/v48-wip02-materialize.yml'
      - 'tools/v48-wip02-html.patch'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize v48 WIP02 and archive WIP01
        if: hashFiles('tools/v48-wip02-html.patch') != ''
        run: |
          set -euo pipefail
          mkdir -p archive/v48/WIP01
          cp Aegis_SIM_v48_WIP01.html archive/v48/WIP01/
          cp AEGIS_PLAN_STATUS_v48_WIP01.md archive/v48/WIP01/
          cp Aegis_SIM_v48_WIP01.html Aegis_SIM_v48_WIP02.html
          patch Aegis_SIM_v48_WIP02.html < tools/v48-wip02-html.patch
          rm Aegis_SIM_v48_WIP01.html AEGIS_PLAN_STATUS_v48_WIP01.md

      - name: Verify WIP02 and exact WIP01 archive
        if: hashFiles('tools/v48-wip02-html.patch') != ''
        run: |
          set -euo pipefail
          test "$(sha256sum Aegis_SIM_v48_WIP02.html | cut -d' ' -f1)" = "711b0863390e7e25f8cf751c4f5406cbc58db247b08aaba1688b2ba72911b874"
          test "$(sha256sum archive/v48/WIP01/Aegis_SIM_v48_WIP01.html | cut -d' ' -f1)" = "2d571674c0e0f7c5d2eb6dedfdfc61b225d0e8e75865f750ddccb031d6a7653a"
          test -s archive/v48/WIP01/AEGIS_PLAN_STATUS_v48_WIP01.md
          test ! -e Aegis_SIM_v48_WIP01.html
          test ! -e AEGIS_PLAN_STATUS_v48_WIP01.md

      - name: Commit materialized WIP02
        if: hashFiles('tools/v48-wip02-html.patch') != ''
        run: |
          set -euo pipefail
          rm tools/v48-wip02-html.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize v48 WIP02 impact physics"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
